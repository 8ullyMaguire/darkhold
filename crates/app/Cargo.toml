[package]
name = "darkhold-app"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true
description = "Darkhold server binary: CLI, composition root, HTTP surface"
build = "build.rs"

[lib]
name = "darkhold_app"
path = "src/lib.rs"

[[bin]]
name = "darkhold"
path = "src/main.rs"

[dependencies]
commons-trend = { path = "../../../../../../projects/commons/crates/commons-trend" }
commons-identify = { path = "../../../../../../projects/commons/crates/commons-identify" }
commons-bounty = { path = "../../../../../../projects/commons/crates/commons-bounty" }
async-trait.workspace = true
anyhow.workspace = true
argon2.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
hex.workspace = true
# The OIDC protocol lives in one estate crate so that four sites cannot drift on PKCE, the nonce, or the
# authorize parameters. Path dependency until the Forgejo registry answers (see the crate's README).
polaris-oidc-client = { path = "../../../../polaris-oidc-client" }
# The estate's metrics registry: `/metrics` used to answer the SPA shell, so a status-code monitor believed
# darkhold published metrics. The renderer and the content type live in polaris-core, once.
polaris-core = { path = "../../../../polaris-core-rust" }
# The estate's one feed renderer (rss2/atom/json_feed, XML escaping, markdown stripping). Until 2026-11-05
# darkhold had three: this crate was unused, `darkhold_domain::feed` rendered the saved-view feed, and
# `darkhold_domain::feeds` rendered nothing a user could see — only a test called it.
commons-feed = { path = "../../../../../../projects/commons/crates/commons-feed" }
mime_guess.workspace = true
rand.workspace = true
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "http2",
    "json",
    # The inbox stream is a body that never ends: without `stream` there is no `bytes_stream()` to pass
    # through, and the only alternative is collecting it forever (measured: the compiler says so).
    "stream",
] }
# The taste service authenticates a product with an HMAC over sub/exp/method/path — the same construction
# `polaris-taste/src/assertion.rs` verifies (ADR 0001, W3 §10).
hmac = "0.12"
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
crc32fast.workspace = true
sqlx.workspace = true
time.workspace = true
tokio.workspace = true
toml.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
url = "2"
tracing-subscriber.workspace = true
uuid.workspace = true

darkhold-db = { path = "../db" }
darkhold-sandbox = { path = "../sandbox" }
darkhold-metadata = { path = "../metadata" }
darkhold-domain = { path = "../domain" }
# `cloudflare-impersonation` is a feature of the scraper crate rather than a
# default of it, so that a library consumer is not made to carry a second HTTP/TLS
# stack. The binary this workspace ships is the instance an operator runs, and it
# is the one that has to be able to read fanfiction.net — so the feature is turned
# on here, once, and the crate stays lean for everybody else.
darkhold-scrapers = { path = "../scrapers", features = ["cloudflare-impersonation"] }
chacha20poly1305 = { version = "0.10", features = ["alloc"] }
chrono = "0.4"
image = { version = "=0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[dev-dependencies]
wat = "1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
test-support = { path = "../test-support" }

[lints]
workspace = true
