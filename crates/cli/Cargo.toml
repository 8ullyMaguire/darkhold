[package]
name = "darkhold-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "dh — a query tool over a Darkhold instance's catalogue"

[[bin]]
name = "dh"
path = "src/main.rs"

[features]
# M63-29: a full-screen mode in this binary, opt-in because it takes over the terminal.
tui = []

[dependencies]
time = { workspace = true, features = ["parsing", "formatting"] }
# M63-03: one definition of the metric vocabulary, shared with the server.
darkhold-domain = { path = "../domain" }
base64.workspace = true
darkhold-db = { path = "../db" }
polaris-jobs = { path = "../../../../estate/crates/polaris-jobs" }
anyhow.workspace = true
clap.workspace = true
reqwest = { workspace = true, features = ["rustls-tls"] }
serde.workspace = true
toml.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
clap_complete = "4.5.67"
clap_mangen = "0.2.32"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
test-support = { path = "../test-support" }
sqlx = { workspace = true }
